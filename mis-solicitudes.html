<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2F4B7C">

  <title>Propuestas recibidas · PetCare Cimitarra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <main id="contenido" class="container">

          </article>
        </li>
        <li>
          <article class="card card--stack">
            <h2 class="card__title">Dra. Lucía Peña</h2>
            <p class="card__text">Propone: mañana, 9:00 a. m.</p>

            <a class="btn btn--primary" href="historial.html" aria-label="Aceptar la propuesta de Dra. Lucía Peña">Aceptar</a>
          </article>
