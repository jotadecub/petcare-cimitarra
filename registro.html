<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#2F4B7C">
  <meta name="description" content="Crea tu cuenta en PetCare Cimitarra como dueño o ganadero, o como veterinario.">
  <title>Crear cuenta · PetCare Cimitarra</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&amp;display=swap">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <a class="skip-link" href="#contenido">Saltar al contenido</a>

  <header class="navbar">
    <div class="navbar__inner">
      <h1 class="navbar__title">Crear cuenta</h1>
    </div>
  </header>

  <main id="contenido" class="container">
    <form class="form" action="panel.html" method="get" data-role-form novalidate>
      <h2 class="title-h2">Registro</h2>

      <div class="field">
        <label class="field__label" for="nombre">Nombre completo</label>
        <input class="input" id="nombre" type="text" placeholder="Ej: Álvaro Ramírez" autocomplete="name">
      </div>

      <div class="field">
        <label class="field__label" for="correo">Correo electrónico</label>
        <input class="input" id="correo" type="email" placeholder="nombre@correo.com" autocomplete="email" inputmode="email">
      </div>

      <div class="field">
        <label class="field__label" for="clave">Contraseña</label>
        <input class="input" id="clave" type="password" placeholder="Mínimo 8 caracteres" autocomplete="new-password">
      </div>

      <fieldset class="field">
        <legend class="field__label">Soy:</legend>
        <div class="chips">
          <label class="chip">
            <input class="chip__input" type="radio" name="rol" value="dueno" checked>
            <span class="chip__label">Dueño / Ganadero</span>
          </label>
          <label class="chip">
            <input class="chip__input" type="radio" name="rol" value="veterinario">
            <span class="chip__label">Veterinario</span>
          </label>
        </div>
      </fieldset>

      <div><button class="btn btn--primary" type="submit">Crear cuenta</button></div>
    </form>
  </main>

  <script src="js/role-redirect.js" defer></script>
</body>
</html>
